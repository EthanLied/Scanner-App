name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag like v1.0.1, v1.0.2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper and Build APK
        run: |
          # Extract the expected Gradle version from gradle-wrapper.properties
          GRADLE_VERSION=$(sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p' gradle/wrapper/gradle-wrapper.properties | head -n 1)
          
          # Generate gradlew and gradle-wrapper.jar matching that version
          if [ -n "$GRADLE_VERSION" ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          else
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
