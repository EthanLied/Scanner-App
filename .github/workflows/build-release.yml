name: Build and Release APK

on:
  workflow_dispatch: # Run on demand with a click in GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper and Build APK
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            GRADLE_VERSION=$(sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p' gradle/wrapper/gradle-wrapper.properties | head -n 1)
          fi

          if [ -n "$GRADLE_VERSION" ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          else
            gradle wrapper
          fi

          # Calculate strictly increasing versions
          # Adding 100 ensures versionCode is higher than any previously installed APK
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          VERSION_NAME="1.0.${{ github.run_number }}"

          echo "Building Version Name: $VERSION_NAME (Code: $VERSION_CODE)"

          chmod +x ./gradlew
          ./gradlew assembleDebug \
            -PappVersionCode="$VERSION_CODE" \
            -PappVersionName="$VERSION_NAME"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Release v1.0.${{ github.run_number }}"
          files: app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
